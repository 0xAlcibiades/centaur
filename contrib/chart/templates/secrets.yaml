{{- $_ := required "secretManager.existingSecretName is required" .Values.secretManager.existingSecretName -}}
{{- $_ := required "firewall.existingCaSecretName is required" .Values.firewall.existingCaSecretName -}}
{{- $_ := required "firewall.existingCaKeySecretName is required" .Values.firewall.existingCaKeySecretName -}}
{{- $bootstrapSecretName := .Values.secrets.bootstrapSecretName | default "" -}}
{{- $staticSecretName := include "centaur.secretEnvName" . -}}
{{- $traceConsentSecretName := "" -}}
{{- if .Values.slackbotv2.enabled -}}
{{- $traceConsentSecretName = include "centaur.traceConsentSecretName" . -}}
{{- end -}}
{{- $caSecretName := include "centaur.trustedCaSecretName" . -}}
{{- $caKeySecretName := include "centaur.trustedCaKeySecretName" . -}}
{{- $sourceAuthSecretName := .Values.ironProxy.sourceAuth.existingSecretName | default "" -}}
{{- if and .Values.apiRs.enabled (ne .Values.ironProxy.secretSource "env") $bootstrapSecretName (eq $bootstrapSecretName $staticSecretName) -}}
{{- fail "secrets.bootstrapSecretName must differ from secretManager.existingSecretName when ironProxy.secretSource is not env: the static service Secret must never contain a broker refresh seed" -}}
{{- end -}}
{{- if and .Values.slackbotv2.enabled (eq $traceConsentSecretName $staticSecretName) -}}
{{- fail "slackbotv2.traceConsent.apiKeySecretName must differ from secretManager.existingSecretName" -}}
{{- end -}}
{{- if and .Values.apiRs.enabled (ne .Values.ironProxy.secretSource "env") (not $sourceAuthSecretName) -}}
{{- fail "ironProxy.sourceAuth.existingSecretName is required when ironProxy.secretSource is not env" -}}
{{- end -}}
{{- if and .Values.apiRs.enabled (ne .Values.ironProxy.secretSource "env") (eq $sourceAuthSecretName $staticSecretName) -}}
{{- fail "ironProxy.sourceAuth.existingSecretName must differ from secretManager.existingSecretName when ironProxy.secretSource is not env" -}}
{{- end -}}
{{- if and .Values.apiRs.enabled (ne .Values.ironProxy.secretSource "env") $bootstrapSecretName (eq $sourceAuthSecretName $bootstrapSecretName) -}}
{{- fail "ironProxy.sourceAuth.existingSecretName must differ from secrets.bootstrapSecretName when ironProxy.secretSource is not env" -}}
{{- end -}}
{{- if and .Values.apiRs.enabled (ne .Values.ironProxy.secretSource "env") (or (eq $sourceAuthSecretName $caSecretName) (eq $sourceAuthSecretName $caKeySecretName)) -}}
{{- fail "ironProxy.sourceAuth.existingSecretName must differ from both firewall CA Secret names when ironProxy.secretSource is not env" -}}
{{- end -}}
{{- if .Values.postgres.enabled -}}
{{- $_ := required "postgres.auth.existingSecretName is required when postgres.enabled=true" .Values.postgres.auth.existingSecretName -}}
{{- $_ := required "postgres.auth.existingSecretKey is required when postgres.enabled=true" .Values.postgres.auth.existingSecretKey -}}
{{- end -}}

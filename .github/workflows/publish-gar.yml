name: Publish Runtime Images to GAR

on:
  workflow_dispatch:
    inputs:
      runtime_sha:
        description: Full runtime commit SHA whose published images should be mirrored
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

env:
  PROJECT_ID: snappy-storm-496900-m0
  GAR_REGISTRY: us-central1-docker.pkg.dev
  GAR_REPOSITORY: us-central1-docker.pkg.dev/snappy-storm-496900-m0/centaur
  WORKLOAD_IDENTITY_PROVIDER: projects/442243473495/locations/global/workloadIdentityPools/github-actions/providers/lean-centaur-overlay
  SERVICE_ACCOUNT: centaur-overlay-deployer@snappy-storm-496900-m0.iam.gserviceaccount.com

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Validate runtime SHA
        env:
          RUNTIME_SHA: ${{ inputs.runtime_sha }}
        run: |
          if [[ ! "${RUNTIME_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runtime_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          echo "RUNTIME_TAG=main-sha-${RUNTIME_SHA:0:7}" >> "${GITHUB_ENV}"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GAR_REGISTRY}" --quiet

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Mirror immutable runtime images
        run: |
          for image in centaur-api-rs centaur-agent centaur-console centaur-slackbotv2; do
            source="ghcr.io/leanxyz/${image}:${RUNTIME_TAG}"
            destination="${GAR_REPOSITORY}/${image}:${RUNTIME_TAG}"
            docker buildx imagetools create --tag "${destination}" "${source}"
            docker buildx imagetools inspect "${destination}"
          done

name: Publish Lean Runtime Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character SHA from main to rebuild (defaults to current main)
        required: false
        type: string

concurrency:
  group: publish-lean-runtime-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_NAMESPACE: snappy-storm-496900-m0/centaur
  IMAGE_SOURCE: https://github.com/leanxyz/centaur

jobs:
  publish:
    if: github.repository == 'leanxyz/centaur' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-rs
            image: centaur-api-rs
            context: .
            dockerfile: services/api-rs/Dockerfile
            target: ""
          - service: slackbotv2
            image: centaur-slackbotv2
            context: .
            dockerfile: services/slackbotv2/Dockerfile
            target: ""
          - service: agent
            image: centaur-agent
            context: .
            dockerfile: services/sandbox/Dockerfile
            target: sandbox
          - service: iron-proxy
            image: centaur-iron-proxy
            context: .
            dockerfile: services/iron-proxy/Dockerfile
            target: ""
          - service: console
            image: centaur-console
            context: services/console
            dockerfile: services/console/Dockerfile
            target: ""

    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Resolve source SHA
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.source_sha }}
        run: |
          requested_sha="${REQUESTED_SHA:-${GITHUB_SHA}}"
          if [[ ! "${requested_sha}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi

          requested_sha="${requested_sha,,}"
          if ! git cat-file -e "${requested_sha}^{commit}"; then
            echo "source_sha is not a commit in this repository" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${requested_sha}" "${GITHUB_SHA}"; then
            echo "source_sha must be reachable from the current main branch" >&2
            exit 1
          fi

          git checkout --detach "${requested_sha}"
          echo "full_sha=${requested_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${requested_sha:0:7}" >> "${GITHUB_OUTPUT}"

      - name: Reclaim runner disk for agent image
        if: matrix.service == 'agent'
        run: |
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/442243473495/locations/global/workloadIdentityPools/github-actions/providers/lean-centaur-runtime-builder
          service_account: centaur-runtime-image-builder@snappy-storm-496900-m0.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Log in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:main-sha-${{ steps.source.outputs.short_sha }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.full_sha }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
          build-args: |
            RUST_BUILD_PROFILE=release
          cache-from: type=gha,scope=lean-runtime-${{ matrix.image }}-linux-amd64
          cache-to: type=gha,mode=max,scope=lean-runtime-${{ matrix.image }}-linux-amd64

      - name: Inspect pushed image
        env:
          IMAGE_URI: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:main-sha-${{ steps.source.outputs.short_sha }}
        run: docker buildx imagetools inspect "${IMAGE_URI}"
